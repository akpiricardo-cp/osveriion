name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://exemple.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: cle-de-construction
          NEXT_TELEMETRY_DISABLED: "1"

  database:
    name: Scénarios SQL (migrations + droits)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGURL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Client PostgreSQL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Migrations et scénarios (gouvernance, finance, droits…)
        run: bash supabase/tests/run.sh
      - name: install.sql à jour
        run: |
          bash scripts/build-install.sh
          git diff --exit-code supabase/install.sql || { echo "::error::supabase/install.sql n'est pas à jour : lancez npm run build:install"; exit 1; }
      - name: Schéma de référence à jour (indicatif)
        continue-on-error: true
        run: |
          PG_DUMP="docker exec -i ${{ job.services.postgres.id }} pg_dump -U postgres" bash scripts/dump-schema.sh || true
          git diff --stat --exit-code supabase/schema/schema.sql || echo "::warning::supabase/schema/schema.sql diffère : lancez npm run schema:dump"
